        <!-- ==================================================================
             1. ENTRADA CINÉTICA EDITORIAL (COREOGRAFÍA BEHANCE 4 TIEMPOS)
             Beat 1: Entra la palabra "Portafolio"
             Beat 2: Se abre a la mitad expandiendo la foto desde un cuadrito -> rectángulo
                     y expandiendo el fondo a toda la sección
             Beat 3: El recuadro de fondo de la foto se reduce y oculta detrás de ella,
                     revelando "Portafolio" detrás de su retrato sin bordes
             Beat 4: Aparecen 4 tarjetas/iconos coloridos de lenguajes y tecnologías
             ================================================================== -->
        <section class="lui-section hero-kinetic-section is-revealed" data-tab-panel="inicio" id="inicio">
          <!-- Escenario Full-Screen 100vw x 100vh -->
          <div class="hero-editorial-stage" id="heroSplitArena">

            <!-- CAPA 0: Recuadro celeste que expande a toda la pantalla y desaparece -->
            <div class="hero-stage-expand-bg" aria-hidden="true"></div>

            <!-- Metadato superior con "Evelyn Barrios" en tipografía elegante arriba al centro -->
            <div class="hero-stage-top-meta">
              <span class="hero-stage-eyebrow-left">GUATEMALA · <strong id="ghRepoCount">66+</strong> REPOSITORIOS</span>
              <span class="hero-signature-top">Evelyn Barrios</span>
              <span class="hero-stage-eyebrow-right" id="typewriterRole">TÉCNICA EN SOFTWARE</span>
            </div>

            <!-- CAPA 2 (Z-2): Palabra Gigante "Portafolio" detrás del retrato -->
            <h1 class="hero-giant-portafolio" aria-label="Portafolio Evelyn Barrios">
              <span class="word-half word-left">Porta</span><span class="word-half word-right">folio</span>
            </h1>

            <!-- CAPA 3 (Z-4): Recuadro detrás de la foto que crece y luego se encoge y oculta DETRÁS de ella -->
            <div class="hero-portrait-frame-shrink" aria-hidden="true"></div>

            <!-- CAPA 4 (Z-5): Retrato a color SIN recuadro alrededor, delante de "Portafolio" -->
            <div class="hero-portrait-freestanding-wrap">
              <img
                src="img/evelyn-hero-azul-estudio.png"
                alt="Evelyn Barrios — Técnica en Desarrollo de Software"
                class="hero-portrait-freestanding"
                id="mainPortraitImg"
              />
            </div>

            <!-- CAPA 5: LAS 4 FOTOS CUADRADAS/RECTANGULARES APARECIENDO UNA A UNA Y QUEDANDO FLOTANDO ALREDEDOR DE ELLA -->
            <!-- 1. Arriba-Izquierda (detrás de "Po", z-1) : Dominio de la AI -->
            <div class="hero-photo-spot hps-tl" data-depth="0.025" data-goto-projects="all" title="Dominio de la AI">
              <img src="img/hero-ia-futuro.jpg" alt="Dominio de la AI" />
              <span class="hps-tag">DOMINIO DE LA AI</span>
            </div>

            <!-- 2. Arriba-Derecha (solapando la "o", z-6) : Bases de Datos -->
            <div class="hero-photo-spot hps-tr" data-depth="0.038" data-goto-projects="backend" title="Bases de Datos">
              <img src="img/hero-bases-datos.jpg" alt="Bases de Datos" />
              <span class="hps-tag">BASES DE DATOS</span>
            </div>

            <!-- 3. Centro-Izquierda (debajo de "Por", z-6) : Enfoque Backend -->
            <div class="hero-photo-spot hps-ml" data-depth="0.032" data-goto-projects="backend" title="Enfoque Backend">
              <img src="img/hero-enfoque-backend.jpg" alt="Enfoque Backend" />
              <span class="hps-tag">ENFOQUE BACKEND</span>
            </div>

            <!-- 4. Centro-Derecha (debajo de "lio", z-4) : API REST -->
            <div class="hero-photo-spot hps-mr" data-depth="0.035" data-goto-projects="backend" title="API REST">
              <img src="img/hero-api-rest.jpg" alt="API REST" />
              <span class="hps-tag">API REST</span>
            </div>

            <!-- Etiquetas editoriales minimalistas de las esquinas -->
            <div class="hero-stage-corner-tags">
              <div class="corner-tag-left">
                <strong>ENFOQUE BACKEND</strong>
                <span>API REST · BASES DE DATOS</span>
              </div>
              <div class="corner-tag-right">
                <strong>DOMINIO DE LA AI</strong>
                <span>SOLUCIONES ESCALABLES · IA</span>
              </div>
            </div>

            <!-- Base exacta del escenario -->
            <div class="hero-stage-baseline">
              <strong>EVELYN BARRIOS</strong>
              <button type="button" class="hero-baseline-cta" data-tab-target="sobre-mi">
                Explorar Portafolio ↓
              </button>
              <strong>2026 //</strong>
            </div>
          </div>
        </section>

        <div id="sec-sobre-mi"></div>

        <div id="sec-contacto"></div>
